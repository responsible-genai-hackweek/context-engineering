  <!-- Slide 01: Title -->
  <section class="slide" aria-label="Title slide">
    <style>
      .slide-01 {
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at center, #582c83 0%, #350056 100%);
        color: var(--uw-white);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: var(--space-12) var(--space-16);
        position: relative;
      }
      .slide-01::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: var(--uw-spirit-gold);
      }
      .slide-01::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 40%;
        height: 4px;
        background: var(--uw-spirit-gold);
      }
      .slide-01 .title-main {
        font-family: var(--font-display-wide);
        font-weight: 800;
        font-size: 4.4rem;
        line-height: 1.08;
        letter-spacing: -0.02em;
        margin-bottom: var(--space-3);
      }
      .slide-01 .title-main span {
        color: var(--uw-spirit-gold);
      }
      .slide-01 .subtitle {
        font-family: var(--font-body);
        font-weight: 300;
        font-size: 1.6rem;
        color: var(--uw-gray-30);
        margin-bottom: var(--space-10);
      }
      .slide-01 .presenter-info {
        font-family: var(--font-body);
        font-size: 1.5rem;
        color: var(--uw-gray-30);
        line-height: 2;
      }
      .slide-01 .presenter-info strong {
        color: var(--uw-white);
        font-weight: 600;
      }
      .slide-01 .date {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: 1rem;
        color: var(--uw-spirit-gold);
        margin-top: var(--space-5);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .slide-01 .node-graph {
        position: absolute;
        top: 60px;
        right: 80px;
        width: 280px;
        height: 280px;
        opacity: 0.4;
      }
      .slide-01 .node-graph circle {
        fill: none;
        stroke: var(--uw-spirit-gold);
        stroke-width: 1.5;
      }
      .slide-01 .node-graph line {
        stroke: var(--uw-spirit-gold);
        stroke-width: 1;
      }
    </style>
    <div class="slide-01">
